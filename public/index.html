
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roblox Remote Text</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: #101116;
            color: #f5f5f5;
            font-family: Arial, sans-serif;
        }

        .panel {
            width: min(440px, 92%);
            padding: 28px;
            background: #1b1d25;
            border: 1px solid #343744;
            border-radius: 18px;
        }

        h1 {
            margin-top: 0;
            font-size: 25px;
        }

        p {
            color: #aeb2c0;
            font-size: 14px;
        }

        textarea {
            width: 100%;
            height: 130px;
            resize: vertical;
            padding: 14px;
            color: white;
            background: #101116;
            border: 1px solid #414556;
            border-radius: 10px;
            font: inherit;
        }

        button {
            width: 100%;
            margin-top: 12px;
            padding: 13px;
            border: 0;
            border-radius: 10px;
            background: #5865f2;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        #status {
            min-height: 20px;
            margin-bottom: 0;
        }
    </style>
</head>

<body>
    <main class="panel">
        <h1>Roblox Remote Text</h1>
        <p>Edit the message displayed in your Roblox game.</p>

        <textarea id="message" maxlength="200"
            placeholder="Enter your message..."></textarea>

        <button id="save">Update Roblox Text</button>
        <p id="status" role="status">Connecting...</p>
    </main>

    <script>
        const message = document.getElementById("message");
        const save = document.getElementById("save");
        const status = document.getElementById("status");

        async function loadText() {
            try {
                const response = await fetch("/api/text");
                if (!response.ok) throw new Error();

                const data = await response.json();
                message.value = data.text;
                status.textContent = "Connected";
            } catch {
                status.textContent = "Could not connect to server.";
            }
        }

        save.addEventListener("click", async () => {
            save.disabled = true;
            status.textContent = "Updating...";

            try {
                const response = await fetch("/api/text", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        text: message.value
                    })
                });

                const data = await response.json();
                if (!response.ok) {
                    throw new Error(data.error || "Update failed.");
                }

                status.textContent = "Updated successfully!";
            } catch (error) {
                status.textContent = error.message ||
                    "Could not connect to server.";
            } finally {
                save.disabled = false;
            }
        });

        loadText();
    </script>
</body>
</html>

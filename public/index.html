
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Roblox Remote Fields</title>
<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    min-height: 100vh;
    padding: 24px;
    display: grid;
    place-items: center;
    background: #101116;
    color: #f5f5f5;
    font-family: Arial, sans-serif;
}

.panel {
    width: min(500px, 100%);
    padding: 26px;
    background: #1b1d25;
    border: 1px solid #343744;
    border-radius: 16px;
}

h1 { margin-top: 0; font-size: 25px; }
.description { color: #aeb2c0; }

.field { margin-top: 17px; }

label {
    display: block;
    margin-bottom: 7px;
    font-weight: bold;
}

textarea {
    width: 100%;
    min-height: 65px;
    resize: vertical;
    padding: 12px;
    border: 1px solid #414556;
    border-radius: 9px;
    background: #101116;
    color: white;
    font: inherit;
}

button {
    width: 100%;
    margin-top: 22px;
    padding: 14px;
    border: 0;
    border-radius: 9px;
    background: #5865f2;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

button:disabled { opacity: .6; }

#status {
    min-height: 20px;
    color: #c4c8d6;
    font-size: 14px;
}
</style>
</head>
<body>
<main class="panel">
    <h1>Roblox Remote Fields</h1>
    <p class="description">
        Edit your five Roblox fields and publish them together.
    </p>

    <div id="fields"></div>

    <button id="update">Update All Fields</button>
    <p id="status" role="status">Loading fields...</p>
</main>

<script>
const keys = ["Field1", "Field2", "Field3", "Field4", "Field5"];
const fieldsContainer = document.getElementById("fields");
const status = document.getElementById("status");
const button = document.getElementById("update");

const inputs = {};

for (const key of keys) {
    const wrapper = document.createElement("div");
    wrapper.className = "field";

    const label = document.createElement("label");
    label.htmlFor = key;
    label.textContent = key;

    const textarea = document.createElement("textarea");
    textarea.id = key;
    textarea.maxLength = 200;
    textarea.placeholder = `Enter text for ${key}`;

    wrapper.append(label, textarea);
    fieldsContainer.appendChild(wrapper);
    inputs[key] = textarea;
}

async function loadFields() {
    try {
        const response = await fetch("/api/fields", {
            cache: "no-store"
        });

        if (!response.ok) throw new Error("Could not load fields.");

        const data = await response.json();

        for (const key of keys) {
            inputs[key].value = data.fields[key] ?? "";
        }

        status.textContent = "Connected. Ready to edit.";
    } catch (error) {
        status.textContent = error.message;
    }
}

button.addEventListener("click", async () => {
    button.disabled = true;
    status.textContent = "Updating all fields...";

    try {
        const values = {};

        for (const key of keys) {
            values[key] = inputs[key].value;
        }

        const response = await fetch("/api/fields", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ fields: values })
        });

        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.error || "Update failed.");
        }

        status.textContent =
            "All five fields updated! Roblox will sync shortly.";
    } catch (error) {
        status.textContent = error.message;
    } finally {
        button.disabled = false;
    }
});

loadFields();
</script>
</body>
</html>
